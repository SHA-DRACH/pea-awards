<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>Vote Confirmed | Paynesville Entertainment Awards</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" defer></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</head>
<body data-page="history">
  <header id="site-header"></header>
  <main>
    <section class="section">
      <div class="container" id="root"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('root');
      const b = PEA.findBallot(PEA.param('ref'));
      if (!b) {
        root.innerHTML = '<div class="empty"><div class="big">🧾</div><p>We couldn’t find that vote.</p><a class="btn" href="history.html">Check my votes</a></div>';
        return;
      }
      const n = PEA.nominee(b.nomineeId) || { id: b.nomineeId, name: b.nomineeName };
      const c = PEA.category(b.categoryId);
      root.innerHTML = `
        <div class="card receipt center reveal">
          <img src="${PEA.photo(n)}" alt="" style="width:110px;height:110px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:3px solid var(--gold);box-shadow:0 0 50px var(--glow)">
          <span class="eyebrow">✓ Vote counted</span>
          <h1 class="gold-text" style="font-size:clamp(1.5rem,5vw,2.3rem)">Thank you for voting!</h1>
          <p class="muted">Your vote for <b style="color:var(--text)">${PEA.esc(b.nomineeName)}</b> in ${PEA.esc(c ? c.name : '')} has been counted.</p>
          <dl>
            <dt>Reference</dt><dd>${b.ref}</dd>
            <dt>Nominee</dt><dd>${PEA.esc(b.nomineeName)}</dd>
            <dt>Category</dt><dd>${PEA.esc(c ? c.name : '')}</dd>
            <dt>Email</dt><dd>${PEA.esc(PEA.maskEmail(b.email))}</dd>
            <dt>Date</dt><dd>${PEA.fmtDate(b.date)}</dd>
            <dt>Status</dt><dd><span class="badge ok">Final — one vote per category</span></dd>
          </dl>
          <div class="grid" style="gap:10px">
            <a class="btn btn-gold btn-block" href="categories.html">Vote in other categories</a>
            <button class="btn btn-ghost btn-block" id="share">📣 Tell your friends</button>
            <a class="btn btn-ghost btn-block" href="history.html">View my voting history</a>
          </div>
        </div>`;
      document.getElementById('share').onclick = async () => {
        const url = location.href.replace(/confirmation\.html.*$/, '') + 'nominee.html?id=' + encodeURIComponent(b.nomineeId);
        const text = `I just voted for ${b.nomineeName} at the Paynesville Entertainment Awards! Vote now:`;
        try {
          if (navigator.share) await navigator.share({ title: 'PEA Awards', text, url });
          else { await navigator.clipboard.writeText(text + ' ' + url); PEA.toast('Message copied — paste it anywhere!'); }
        } catch (e) {}
      };
    });
  </script>
</body>
</html>
