<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>Vote Confirmed | Paynesville Entertainment Awards</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="history">
  <header id="site-header"></header>
  <main>
    <section class="section">
      <div class="container" id="root"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('root');
      const tx = PEA.findTx(PEA.param('ref'));
      if (!tx) {
        root.innerHTML = '<div class="empty"><div class="big">🧾</div><p>We couldn’t find that receipt.</p><a class="btn" href="history.html">Check my votes</a></div>';
        return;
      }
      const n = PEA.nominee(tx.nomineeId) || { id: tx.nomineeId, name: tx.nomineeName };
      const c = PEA.category(tx.categoryId);
      root.innerHTML = `
        <div class="card receipt center reveal">
          <div class="success-icon">✓</div>
          <span class="eyebrow">Payment successful</span>
          <h1 class="gold-text" style="font-size:clamp(1.6rem,5vw,2.4rem)">Thank you for voting!</h1>
          <p class="muted">Your <b style="color:var(--gold-light)">${PEA.num(tx.votes)} vote${tx.votes > 1 ? 's' : ''}</b> for
            <b style="color:var(--text)">${PEA.esc(tx.nomineeName)}</b> ${tx.votes > 1 ? 'have' : 'has'} been counted.</p>
          <dl>
            <dt>Reference</dt><dd>${tx.ref}</dd>
            <dt>Nominee</dt><dd>${PEA.esc(tx.nomineeName)}</dd>
            <dt>Category</dt><dd>${PEA.esc(c ? c.name : '')}</dd>
            <dt>Votes purchased</dt><dd>${PEA.num(tx.votes)}</dd>
            <dt>Amount paid</dt><dd>${PEA.money(tx.amount)}</dd>
            <dt>Payment method</dt><dd>${PEA.methodName(tx.method)}</dd>
            <dt>Phone</dt><dd>${PEA.esc(tx.phone)}</dd>
            <dt>Date</dt><dd>${PEA.fmtDate(tx.date)}</dd>
            <dt>Status</dt><dd><span class="badge ok">${tx.status}</span></dd>
          </dl>
          <div class="grid" style="gap:10px">
            <a class="btn btn-gold btn-block" href="vote.html?id=${encodeURIComponent(tx.nomineeId)}">Vote again for ${PEA.esc(tx.nomineeName.split(' – ')[0])}</a>
            <button class="btn btn-block" id="share">📣 Tell your friends</button>
            <a class="btn btn-ghost btn-block" href="history.html?phone=${encodeURIComponent(tx.phone)}">View my voting history</a>
          </div>
        </div>`;
      document.getElementById('share').onclick = async () => {
        const url = location.origin + location.pathname.replace(/confirmation\.html$/, '') + 'nominee.html?id=' + encodeURIComponent(tx.nomineeId);
        const text = `I just voted for ${tx.nomineeName} at the Paynesville Entertainment Awards! Vote now:`;
        try {
          if (navigator.share) await navigator.share({ title: 'PEA Awards', text, url });
          else { await navigator.clipboard.writeText(text + ' ' + url); PEA.toast('Message copied — paste it anywhere!'); }
        } catch (e) {}
      };
    });
  </script>
</body>
</html>
