<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>Nominees | Paynesville Entertainment Awards</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .poster-wrap { max-width: 560px; margin: 0 auto 30px; }
    .poster-wrap details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .poster-wrap summary { padding: 14px 18px; cursor: pointer; color: var(--gold-light); font-weight: 500; list-style: none; display: flex; justify-content: space-between; }
    .poster-wrap summary::-webkit-details-marker { display: none; }
    .poster-wrap summary::after { content: "▾"; }
    .poster-wrap details[open] summary::after { content: "▴"; }
    .poster-wrap img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #111; }
  </style>
</head>
<body data-page="categories">
  <header id="site-header"></header>
  <main>
    <section class="page-head">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a> / <a href="categories.html">Categories</a> / <span id="crumb"></span></div>
        <div style="font-size:2.4rem" id="cat-icon"></div>
        <h1 class="gold-text" id="cat-name">Nominees</h1>
        <p class="muted" id="cat-sub"></p>
      </div>
    </section>
    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="chips" id="chips" style="margin-bottom:24px"></div>
        <div class="poster-wrap" id="poster"></div>
        <div class="grid nom-grid" id="noms"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cats = PEA.categories();
      const c = PEA.category(PEA.param('cat')) || cats[0];
      if (!c) return;
      document.title = c.name + ' | PEA';
      document.getElementById('crumb').textContent = c.name;
      document.getElementById('cat-icon').textContent = c.icon;
      document.getElementById('cat-name').textContent = c.name;
      document.getElementById('cat-sub').textContent = `${PEA.byCategory(c.id).length} nominees · ${PEA.money(PEA.settings().pricePerVote)} per vote`;

      const chips = document.getElementById('chips');
      chips.innerHTML = cats.map(x => `<a class="chip ${x.id === c.id ? 'active' : ''}" href="nominees.html?cat=${encodeURIComponent(x.id)}">${x.icon} ${PEA.esc(x.name)}</a>`).join('');
      chips.querySelector('.active')?.scrollIntoView({ inline: 'center', block: 'nearest' });
      window.scrollTo(0, 0);

      if (c.poster) {
        document.getElementById('poster').innerHTML = `
          <details open><summary>🖼️ Official category poster</summary>
          <img src="${PEA.esc(c.poster)}" alt="Official ${PEA.esc(c.name)} nominees poster" loading="lazy"></details>`;
      }

      const open = PEA.settings().votingOpen;
      document.getElementById('noms').innerHTML = PEA.byCategory(c.id).map(n => `
        <article class="nom-card reveal">
          <a class="photo" href="nominee.html?id=${encodeURIComponent(n.id)}"><img src="${PEA.photo(n)}" alt="${PEA.esc(n.name)}" loading="lazy"></a>
          <div class="body">
            <span class="cat">${PEA.esc(c.name)}</span>
            <h3>${PEA.esc(n.name)}</h3>
            <div class="actions">
              <a class="btn btn-ghost btn-sm" href="nominee.html?id=${encodeURIComponent(n.id)}">Profile</a>
              <a class="btn btn-gold btn-sm" href="vote.html?id=${encodeURIComponent(n.id)}" ${open ? '' : 'aria-disabled="true" style="opacity:.45;pointer-events:none"'}>Vote</a>
            </div>
          </div>
        </article>`).join('') || '<div class="empty" style="grid-column:1/-1"><div class="big">🏆</div>Nominees coming soon.</div>';
    });
  </script>
</body>
</html>
