<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>Award Categories | Paynesville Entertainment Awards</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
  <link rel="stylesheet" href="css/style.css?v=136cb43cf4">
  <link rel="stylesheet" href="css/stage.css?v=fe24a04d8b">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" defer></script>
  <script src="js/data.js?v=c0a23a0d46"></script>
  <script src="js/app.js?v=36130eb547"></script>
</head>
<body data-page="categories">
  <div class="splash" id="splash" aria-hidden="true"><div class="stage-logo big"><span class="rays"></span><span class="beam l"></span><span class="beam r"></span><span class="halo"></span><span class="floor"></span><img src="assets/logo.png" alt="PEA Awards logo"><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i></div><div class="splash-title">Paynesville Entertainment Awards</div></div>
  <header id="site-header"></header>
  <main>
    <section class="page-head stage-head">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a> / Categories</div>
        <span class="eyebrow" id="season">PEA 2026/2027</span>
        <h1 class="gold-text">Award Categories</h1>
        <p class="muted">Choose a category to see the nominees and cast your votes.</p>
        <div style="max-width:420px;margin:20px auto 0">
          <input class="input" id="search" type="search" placeholder="🔍  Search categories or nominees…" aria-label="Search categories or nominees">
        </div>
      </div>
    </section>
    <section class="section" style="padding-top:10px">
      <div class="container">
        <div id="cats"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const E = PEA.esc;
      document.getElementById('season').textContent = 'PEA ' + PEA.settings().season;
      const catsEl = document.getElementById('cats');
      const tile = n => `<a class="nom-tile" href="nominee.html?id=${encodeURIComponent(n.id)}"><img src="${PEA.thumb(n)}" alt="" loading="lazy" decoding="async">
        <span class="t"><b>${E(n.name)}</b><span class="btn btn-gold btn-sm">Vote</span></span></a>`;
      function render(q = '') {
        q = q.trim().toLowerCase();
        const cats = PEA.categories().filter(c => !q || c.name.toLowerCase().includes(q) || PEA.byCategory(c.id).some(n => n.name.toLowerCase().includes(q)));
        catsEl.innerHTML = cats.map(c => {
          const list = PEA.byCategory(c.id).filter(n => !q || c.name.toLowerCase().includes(q) || n.name.toLowerCase().includes(q));
          return `<section class="cat-row"><div class="cat-row-head"><span class="icon">${E(c.icon)}</span>
            <div class="grow"><h2>${E(c.name)}</h2><small>${PEA.byCategory(c.id).length} nominees</small></div>
            <div class="arrows"><button type="button" data-dir="-1" aria-label="Scroll left">‹</button><button type="button" data-dir="1" aria-label="Scroll right">›</button></div>
            <a class="btn btn-sm btn-gold" href="nominees.html?cat=${encodeURIComponent(c.id)}">Vote →</a></div>
            <div class="scroller">${list.map(tile).join('')}</div></section>`;
        }).join('') || '<div class="empty"><div class="big">🔍</div>No categories or nominees found.</div>';
        PEA.animate();
      }
      catsEl.addEventListener('click', e => {
        const b = e.target.closest('[data-dir]'); if (!b) return;
        const sc = b.closest('.cat-row').querySelector('.scroller');
        sc.scrollBy({ left: Number(b.dataset.dir) * sc.clientWidth * .8, behavior: 'smooth' });
      });
      render();
      let t; document.getElementById('search').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => render(e.target.value), 200); });
    });
  </script>
</body>
</html>
