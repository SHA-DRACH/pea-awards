<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>Award Categories | Paynesville Entertainment Awards</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" defer></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</head>
<body data-page="categories">
  <header id="site-header"></header>
  <main>
    <section class="page-head">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a> / Categories</div>
        <span class="eyebrow" id="season">PEA 2026/2027</span>
        <h1 class="gold-text">Award Categories</h1>
        <p class="muted">Choose a category to see the nominees and cast your votes.</p>
        <div style="max-width:420px;margin:20px auto 0">
          <input class="input" id="search" type="search" placeholder="🔍  Search categories or nominees…" aria-label="Search categories or nominees">
        </div>
      </div>
    </section>
    <section class="section" style="padding-top:10px">
      <div class="container">
        <div class="grid grid-3" id="cats"></div>
        <div id="nom-results" style="margin-top:30px"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('season').textContent = 'PEA ' + PEA.settings().season;
      const catsEl = document.getElementById('cats');
      const nomEl = document.getElementById('nom-results');

      function render(q = '') {
        q = q.trim().toLowerCase();
        const cats = PEA.categories().filter(c => !q || c.name.toLowerCase().includes(q));
        catsEl.innerHTML = cats.map(c => `
          <a class="cat-card" href="nominees.html?cat=${encodeURIComponent(c.id)}">
            <div class="icon">${c.icon}</div>
            <h3>${PEA.esc(c.name)}</h3>
            <p>${PEA.esc(c.desc || PEA.byCategory(c.id).slice(0, 3).map(n => n.name).join(' · ') + (PEA.byCategory(c.id).length > 3 ? ' …' : ''))}</p>
            <div class="meta"><span>${PEA.byCategory(c.id).length} nominees</span><span>Vote →</span></div>
          </a>`).join('');

        const noms = q ? PEA.nominees().filter(n => n.name.toLowerCase().includes(q)) : [];
        nomEl.innerHTML = noms.length ? `
          <h2 style="font-size:1.3rem">Nominees matching “${PEA.esc(q)}”</h2>
          <div class="grid grid-4">${noms.map(n => `
            <a class="manage-item" href="nominee.html?id=${encodeURIComponent(n.id)}" style="color:var(--text)">
              <img src="${PEA.photo(n)}" alt="">
              <div class="info"><b>${PEA.esc(n.name)}</b><small>${PEA.esc(PEA.category(n.categoryId)?.name || '')}</small></div>
            </a>`).join('')}</div>` : '';
        if (!cats.length && !noms.length) catsEl.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">🔍</div>No categories or nominees found.</div>';
        PEA.animate();
      }
      render();
      document.getElementById('search').addEventListener('input', e => render(e.target.value));
    });
  </script>
</body>
</html>
