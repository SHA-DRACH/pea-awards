<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>My Voting History | Paynesville Entertainment Awards</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="history">
  <header id="site-header"></header>
  <main>
    <section class="page-head">
      <div class="container">
        <span class="eyebrow">Voter History</span>
        <h1 class="gold-text">My Votes</h1>
        <p class="muted">Enter the Mobile Money number you paid with to see your purchases and voting records.</p>
        <form id="lookup" class="card" style="max-width:520px;margin:24px auto 0;text-align:left" novalidate>
          <div class="field" style="margin-bottom:12px">
            <label for="phone">Mobile Money number</label>
            <input class="input" id="phone" type="tel" inputmode="tel" placeholder="e.g. 0770 123 456" autocomplete="tel">
            <span class="error-text" id="err"></span>
          </div>
          <button class="btn btn-gold btn-block" type="submit">Show my votes</button>
        </form>
      </div>
    </section>
    <section class="section" style="padding-top:10px">
      <div class="container" style="max-width:820px" id="results"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const phoneEl = document.getElementById('phone');
      const results = document.getElementById('results');

      function show(phone) {
        const list = PEA.historyFor(phone);
        if (!list.length) {
          results.innerHTML = `<div class="empty"><div class="big">🗳️</div><p>No votes found for <b>${PEA.esc(PEA.normalizePhone(phone))}</b> yet.</p><a class="btn btn-gold" href="categories.html">Start voting</a></div>`;
          return;
        }
        const votes = list.reduce((t, x) => t + x.votes, 0);
        const spent = list.reduce((t, x) => t + x.amount, 0);
        const nominees = new Set(list.map(x => x.nomineeId)).size;
        results.innerHTML = `
          <div class="kpis">
            <div class="kpi"><span>Total votes</span><strong>${PEA.num(votes)}</strong></div>
            <div class="kpi"><span>Total spent</span><strong>${PEA.money(spent)}</strong></div>
            <div class="kpi"><span>Purchases</span><strong>${list.length}</strong></div>
            <div class="kpi"><span>Nominees supported</span><strong>${nominees}</strong></div>
          </div>
          <div class="tx-list">${list.map(t => {
            const n = PEA.nominee(t.nomineeId) || { id: t.nomineeId, name: t.nomineeName };
            const c = PEA.category(t.categoryId);
            return `<a class="tx" href="confirmation.html?ref=${encodeURIComponent(t.ref)}" style="color:var(--text)">
              <img src="${PEA.photo(n)}" alt="">
              <div><h4>${PEA.esc(t.nomineeName)}</h4>
                <div class="sub">${PEA.esc(c ? c.name : '')}</div>
                <div class="sub">${PEA.fmtDate(t.date)} · <span class="badge ${t.method}">${PEA.methodName(t.method)}</span></div></div>
              <div class="amt"><strong>${PEA.num(t.votes)} vote${t.votes > 1 ? 's' : ''}</strong><span class="sub">${PEA.money(t.amount)}</span></div>
            </a>`;
          }).join('')}</div>`;
      }

      document.getElementById('lookup').addEventListener('submit', e => {
        e.preventDefault();
        const err = document.getElementById('err');
        if (!PEA.validPhone(phoneEl.value)) { err.textContent = 'Enter a valid 10-digit Liberian mobile number.'; phoneEl.classList.add('invalid'); return; }
        err.textContent = ''; phoneEl.classList.remove('invalid');
        history.replaceState(null, '', '?phone=' + encodeURIComponent(PEA.normalizePhone(phoneEl.value)));
        show(phoneEl.value);
      });

      let initial = PEA.param('phone');
      if (!initial) { try { initial = JSON.parse(localStorage.getItem('pea_voter') || '{}').phone; } catch (e) {} }
      if (initial) { phoneEl.value = initial; if (PEA.validPhone(initial)) show(initial); }
    });
  </script>
</body>
</html>
