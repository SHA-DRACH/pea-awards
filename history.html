<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>My Votes | Paynesville Entertainment Awards</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
  <link rel="stylesheet" href="css/style.css?v=136cb43cf4">
  <link rel="stylesheet" href="css/stage.css?v=fe24a04d8b">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" defer></script>
  <script src="js/data.js?v=c0a23a0d46"></script>
  <script src="js/app.js?v=36130eb547"></script>
</head>
<body data-page="history">
  <div class="splash" id="splash" aria-hidden="true"><div class="stage-logo big"><span class="rays"></span><span class="beam l"></span><span class="beam r"></span><span class="halo"></span><span class="floor"></span><img src="assets/logo.png" alt="PEA Awards logo"><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i></div><div class="splash-title">Paynesville Entertainment Awards</div></div>
  <header id="site-header"></header>
  <main>
    <section class="page-head stage-head">
      <div class="container">
        <span class="eyebrow">Voter History</span>
        <h1 class="gold-text">My Votes</h1>
        <p class="muted">Enter the email you voted with to see your votes and the categories you can still vote in.</p>
        <form id="lookup" class="card" style="max-width:520px;margin:24px auto 0;text-align:left" novalidate>
          <div class="field" style="margin-bottom:12px">
            <label for="email">Email address</label>
            <input class="input" id="email" type="email" inputmode="email" placeholder="you@example.com" autocomplete="email">
            <span class="error-text" id="err"></span>
          </div>
          <button class="btn btn-gold btn-block" type="submit">Show my votes</button>
        </form>
      </div>
    </section>
    <section class="section" style="padding-top:10px">
      <div class="container" style="max-width:860px" id="results"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const emailEl = document.getElementById('email');
      const results = document.getElementById('results');

      function show(email) {
        const list = PEA.historyFor(email);
        if (!list.length) {
          results.innerHTML = `<div class="empty"><div class="big">🗳️</div><p>No votes found for <b>${PEA.esc(PEA.normalizeEmail(email))}</b> yet.</p><a class="btn btn-gold" href="categories.html">Start voting</a></div>`;
          return;
        }
        const cats = PEA.categories();
        const used = cats.filter(c => PEA.usedInCategory(email, c.id) > 0).length;
        const remaining = cats.reduce((t, c) => t + PEA.remainingInCategory(email, c.id), 0);
        const left = cats.filter(c => PEA.remainingInCategory(email, c.id) > 0);
        results.innerHTML = `
          <div class="kpis">
            <div class="kpi"><span>Votes cast</span><strong>${PEA.num(list.length)}</strong></div>
            <div class="kpi"><span>Categories voted</span><strong>${used} / ${cats.length}</strong></div>
            <div class="kpi"><span>Nominees supported</span><strong>${new Set(list.map(x => x.nomineeId)).size}</strong></div>
            <div class="kpi"><span>Categories left</span><strong>${PEA.num(remaining)}</strong></div>
          </div>
          <h2 style="font-size:1.2rem">Your votes</h2>
          <div class="tx-list">${list.map(b => {
            const n = PEA.nominee(b.nomineeId) || { id: b.nomineeId, name: b.nomineeName };
            const c = PEA.category(b.categoryId);
            return `<a class="tx" href="confirmation.html?ref=${encodeURIComponent(b.ref)}">
              <img src="${PEA.photo(n)}" alt="">
              <div><h4>${PEA.esc(b.nomineeName)}</h4><div class="sub">${PEA.esc(c ? c.name : '')}</div><div class="sub">${PEA.fmtDate(b.date)}</div></div>
              <div class="amt"><strong>1 vote</strong><span class="sub">${b.ref}</span></div></a>`;
          }).join('')}</div>
          ${left.length ? `<h2 style="font-size:1.2rem;margin-top:30px">Categories you can still vote in</h2>
          <div class="cat-progress">${left.map(c => `<a class="row" href="nominees.html?cat=${encodeURIComponent(c.id)}"><span>${c.icon} ${PEA.esc(c.name)}</span><span class="badge">Vote →</span></a>`).join('')}</div>` : ''}`;
      }

      document.getElementById('lookup').addEventListener('submit', e => {
        e.preventDefault();
        const err = document.getElementById('err');
        if (!PEA.validEmail(emailEl.value)) { err.textContent = 'Please enter a valid email address.'; emailEl.classList.add('invalid'); return; }
        err.textContent = ''; emailEl.classList.remove('invalid');
        show(emailEl.value);
      });

      let initial = null;
      try { initial = JSON.parse(localStorage.getItem('pea_voter') || '{}').email; } catch (e) {}
      if (initial) { emailEl.value = initial; if (PEA.validEmail(initial)) show(initial); }
    });
  </script>
</body>
</html>
